name: Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/price_cache
          key: price-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Update price cache
        run: python price_cache.py

      - name: Run live Plan 2 screener
        run: python main.py

      - name: Save signal and IPO history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add signal_history.csv ipo_watchlist.csv 2>/dev/null || true
          if [ -f ipo_auto_discovered.csv ]; then git add ipo_auto_discovered.csv; fi
          git diff --cached --quiet || git commit -m "Update Plan 2 signals and IPO watch"
          git push

      - name: Run ₹20,000 capital execution test
        run: python capital_execution_test.py

      - name: Upload live and capital results
        uses: actions/upload-artifact@v4
        with:
          name: plan2-capital-results-${{ github.run_id }}
          path: |
            ranking.csv
            live_plan2_ranking.csv
            live_plan2_top100.csv
            live_plan2_top50.csv
            ipo_watch.csv
            ipo_auto_discovered.csv
            capital_execution_test.csv
          if-no-files-found: error
          retention-days: 30

      - name: Backtest
        run: python backtest_id.py

      - name: Walk forward
        run: python walk_forward.py

      - name: Bear market test
        run: python bear_market_test.py

      - name: Liquidity test
        run: python liquidity_test.py

      - name: Liquidity stress test
        run: python liquidity_stress_test.py

      - name: Concentration drawdown test
        run: python concentration_drawdown_test.py

      - name: Complete
        run: echo "Plan 2 + capital execution test completed"
