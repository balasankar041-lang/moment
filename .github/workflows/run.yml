name: Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persistent Yahoo historical-data cache.
      # First run builds the cache; later runs update only the recent period.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/price_cache
          key: price-cache-${{ runner.os }}-${{ hashFiles('nifty500_membership_timeline.csv') }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Update price cache
        run: python price_cache.py

      - name: Run main screener
        run: python main.py

      - name: Run backtest
        run: python backtest.py

      - name: Run Plan2 backtest
        run: python backtest_id.py

      - name: Run liquidity test
        run: python liquidity_test.py

      - name: Run concentration drawdown test
        run: python concentration_drawdown_test.py

      - name: Run liquidity stress test
        run: python liquidity_stress_test_v2.py
