name: Run Quant Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python backtest.py
      - run: python backtest_id.py
      - run: python live_screener.py
      - run: python plan2_robustness_final.py
      - run: python walk_forward.py
      - name: Run bear market test
        run: python bear_market_test.py
      - name: Run risk management test
        run: python risk_management_test.py
      - name: Run volatility position sizing test
        run: python volatility_position_sizing_test.py
      - name: Run portfolio concentration test
        run: python portfolio_concentration_test.py
      - name: Run concentration drawdown test
        run: python concentration_drawdown_test.py  
      - name: Upload live signals
        uses: actions/upload-artifact@v4
        with:
         name: live-signals
         path: live_top50_signals.csv
      - name: Upload robustness results
        uses: actions/upload-artifact@v4
        with:
          name: robustness-results
          path: |
             plan2_robustness_results_validated.csv
             plan2_robustness_base_validation_failed.csv
      - name: Upload risk management results
        uses: actions/upload-artifact@v4
        with:
          name: risk-management-results
          path: |
            plan2_risk_management_monthly.csv
            plan2_risk_management_yearly.csv
      - name: Upload volatility sizing results
        uses: actions/upload-artifact@v4
        with:
          name: volatility-sizing-results
          path: |
            plan2_volatility_sizing_monthly.csv
            plan2_volatility_sizing_yearly.csv     
