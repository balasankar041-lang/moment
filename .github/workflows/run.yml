name: Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # PRICE CACHE
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/price_cache
          key: price-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-cache-${{ runner.os }}-

      - name: Update price cache
        run: python price_cache.py

      # LIVE PLAN 2
      - name: Run Plan 2 Live Screener
        run: python main.py

      # SAVE LIVE RESULTS
      - name: Upload Plan 2 results
        uses: actions/upload-artifact@v4
        with:
          name: plan2-live-results-${{ github.run_id }}
          path: |
            ranking.csv
            live_plan2_ranking.csv
            live_plan2_top100.csv
            live_plan2_top50.csv
          if-no-files-found: error
          retention-days: 30

      # CORE VALIDATION
      - name: Run Plan 2 backtest
        run: python backtest_id.py

      - name: Run Walk Forward
        run: python walk_forward.py

      - name: Run Bear Market Test
        run: python bear_market_test.py

      - name: Run Liquidity Test
        run: python liquidity_test.py

      - name: Run Liquidity Stress Test
        run: python liquidity_stress_test.py

      - name: Run Concentration Drawdown Test
        run: python concentration_drawdown_test.py

      - name: Complete
        run: echo "Plan 2 live screener and core validation completed successfully."
